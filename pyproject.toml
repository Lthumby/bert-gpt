[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-gpt"
version = "0.1.0"
description = "A GPT language model built from scratch with Python and NumPy"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "regex>=2023.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]